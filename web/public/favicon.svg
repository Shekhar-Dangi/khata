<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Khata">
  <!-- A bahi-khata: the cloth-bound Indian ledger, tied shut with string.
       Ink-on-paper, no gradient. Four shapes, so it still reads at 16px. -->
  <rect width="32" height="32" rx="7" fill="#1f5136"/>
  <!-- the book -->
  <rect x="7" y="6" width="18" height="20" rx="1.6" fill="#faf7f0"/>
  <!-- the bound edge -->
  <rect x="9.4" y="6" width="0.9" height="20" fill="#1f5136" opacity="0.25"/>
  <!-- ruled lines: what makes it a ledger rather than a book. They blend at 16px
       and read at 32px and above, which is the point. -->
  <g fill="#1c1a15" opacity="0.3">
    <rect x="12" y="10.4" width="4.6" height="0.9" rx="0.45"/>
    <rect x="12" y="14.2" width="4.6" height="0.9" rx="0.45"/>
    <rect x="12" y="18" width="4.6" height="0.9" rx="0.45"/>
  </g>
  <!-- the tie, wrapped around the fore-edge -->
  <rect x="18.4" y="4.2" width="2.7" height="23.6" rx="0.6" fill="#a2472f"/>
</svg>
